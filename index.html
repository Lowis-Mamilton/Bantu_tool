<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="班圖">
<link rel="apple-touch-icon" href="./icon/bantuicon.png">
<link rel="manifest" href="manifest.json">
<title>班圖 Bantu</title>
<style>
:root{
  --bg:#faf8f4;--card:#ffffff;--dark:#2a2620;
  --text:#2a2620;--t2:#6b655c;--t3:#a8a299;
  --bd:#ece8e1;--bd2:#e5dfd4;--day-empty:#f7f4ee;
  --r:20px;--rs:12px;--nav-h:72px;--safe:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);font-family:-apple-system,'SF Pro Text','PingFang TC','Microsoft JhengHei',sans-serif;color:var(--text);overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column}
.page{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + var(--safe) + 16px);display:none}
.page.active{display:block}
@supports(padding:max(0px)){.page{padding-bottom:calc(var(--nav-h) + max(var(--safe),16px))}}
nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe));background:rgba(250,248,244,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--bd);display:flex;align-items:flex-start;padding-top:8px;z-index:100}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;background:none;border:none;cursor:pointer;color:var(--t3);font-size:10px;font-weight:600;letter-spacing:.2px;transition:color .2s}
.nav-btn.active{color:var(--dark)}
.nav-btn svg{width:22px;height:22px}
.ph{padding:20px 20px 0;display:flex;align-items:flex-start;justify-content:space-between}
.ph-title{font-size:30px;font-weight:700;letter-spacing:-.02em}
.ph-sub{font-size:12px;color:var(--t3);margin-top:2px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.icon-btn{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;display:flex;align-items:center;justify-content:center;color:var(--t2);cursor:pointer}
.today-card{background:var(--dark);color:#faf8f4;border-radius:var(--r);padding:18px 20px;margin:14px 20px 0;cursor:pointer}
.tc-label{display:flex;align-items:center;gap:6px;font-size:12px;color:#b5ac9f;margin-bottom:10px;font-weight:500}
.tc-empty{font-size:15px;color:#8a847a;padding:2px 0 4px}
.tc-add{margin-top:12px;background:rgba(250,248,244,.12);border:1px solid rgba(250,248,244,.2);color:#faf8f4;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.tc-shift{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(250,248,244,.1)}
.tc-shift:last-child{border-bottom:none;padding-bottom:0}
.tc-shift:first-child{padding-top:0}
.tc-job-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.tc-job-name{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.tc-time{font-size:20px;font-weight:700;letter-spacing:-.01em;flex:1}
.tc-hrs{font-size:13px;color:#c9c0b3}
.tc-note-txt{font-size:12px;color:#e8c87a;margin-top:2px}
.week-strip{display:flex;gap:6px;margin:14px 20px 0;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.week-strip::-webkit-scrollbar{display:none}
.wdi{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;width:42px;padding:8px 0;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:all .15s}
.wdi.today-item{background:var(--dark);border-color:var(--dark)}
.wdi-name{font-size:10px;font-weight:600;color:var(--t3);letter-spacing:.3px}
.wdi-num{font-size:16px;font-weight:600;color:var(--text)}
.wdi-dots{display:flex;gap:3px;height:7px;align-items:center}
.wdi-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.wdi.today-item .wdi-name,.wdi.today-item .wdi-num{color:#faf8f4}
.sec-label{font-size:11.5px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;padding:16px 20px 8px}
.shift-item{background:var(--card);margin:0 20px 8px;border-radius:var(--rs);padding:13px 16px;display:flex;align-items:center;gap:12px;border:1px solid var(--bd);cursor:pointer;transition:transform .1s}
.shift-item:active{transform:scale(.98)}
.s-bar{width:3px;border-radius:2px;align-self:stretch;min-height:38px}
.s-info{flex:1;min-width:0}
.s-name{font-size:14px;font-weight:600;margin-bottom:2px}
.s-time{font-size:13px;color:var(--t2)}
.s-meta{font-size:12px;color:var(--t3);margin-top:2px}
.s-hrs{font-size:20px;font-weight:700;color:var(--text);text-align:right;letter-spacing:-.01em}
.s-hrs-lbl{font-size:10px;color:var(--t3);text-align:right}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 0}
.cal-nav-btn{width:36px;height:36px;border:1px solid var(--bd);background:var(--card);border-radius:10px;cursor:pointer;color:var(--t2);font-size:16px;display:flex;align-items:center;justify-content:center}
.cal-month-lbl{font-size:20px;font-weight:700;letter-spacing:-.01em}
.cal-month-lbl span{color:var(--t2);font-weight:500}
.cal-grid{margin:14px 20px 0;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px}
.cal-wds{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.cal-wd{text-align:center;font-size:11px;font-weight:600;color:var(--t3);padding:4px 0;letter-spacing:.3px}
.cal-wd:first-child{color:rgba(192,57,43,.65)}
.cal-wd:last-child{color:rgba(91,130,216,.75)}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{aspect-ratio:1/1.18;border:1px solid transparent;border-radius:12px;background:var(--day-empty);display:flex;flex-direction:column;align-items:center;padding:5px 3px 4px;cursor:pointer;transition:transform .1s;position:relative;gap:1px}
.cal-day:active{transform:scale(.94)}
.cal-day.other-m{opacity:.28}
.cal-day.today{background:var(--card)!important;border:2px solid var(--dark)!important}
.cal-day.sunday .day-num{color:rgba(192,57,43,.8)}
.cal-day.saturday .day-num{color:rgba(46,95,163,.8)}
.cal-day.today .day-num{color:var(--dark)!important;font-weight:700}
.day-num{font-size:13px;font-weight:600;line-height:1;color:#8a847a}
.day-time-row{font-size:8.5px;font-weight:600;line-height:1.2;text-align:center;border-radius:3px;padding:1px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-dots-row{display:flex;gap:2px;justify-content:center;margin-top:auto}
.day-dot{width:5px;height:5px;border-radius:50%}
.day-add{margin-top:auto;color:#d4cdbf;font-size:13px}
.cal-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:10px 0 2px;margin-top:8px;border-top:1px solid var(--bd)}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--t2);font-weight:500}
.legend-dot{width:8px;height:8px;border-radius:50%}
.salary-card{background:var(--dark);color:#faf8f4;border-radius:var(--r);padding:20px 22px;margin:14px 20px 0}
.salary-lbl{font-size:12px;color:#b5ac9f;margin-bottom:4px;font-weight:500}
.salary-val{font-size:36px;font-weight:800;letter-spacing:-.03em}
.salary-det{font-size:12px;color:#c9c0b3;margin-top:4px}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 20px 0}
.stat-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--rs);padding:16px 14px}
.stat-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:8px}
.stat-value{font-size:24px;font-weight:700;letter-spacing:-.02em}
.stat-label{font-size:12px;color:var(--t2);margin-top:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--rs);padding:4px 16px;margin:0 20px}
.bd-item{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd);gap:10px}
.bd-item:last-child{border-bottom:none}
.bd-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.bd-name{flex:1;font-size:14px;font-weight:500}
.bd-cnt{font-size:13px;color:var(--t2)}
.bd-hrs{font-size:14px;font-weight:600}
.month-sel{display:flex;align-items:center;justify-content:center;gap:16px;padding:14px 20px 0}
.month-sel-btn{width:30px;height:30px;border:1px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer;font-size:14px;color:var(--t2);display:flex;align-items:center;justify-content:center}
.month-sel-lbl{font-size:16px;font-weight:600}
.set-sec{margin:0 20px}
.set-group{background:var(--card);border:1px solid var(--bd);border-radius:var(--rs);overflow:hidden;margin-bottom:18px}
.set-row{display:flex;align-items:center;padding:15px 16px;border-bottom:1px solid var(--bd);gap:12px}
.set-row:last-child{border-bottom:none}
.set-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.set-lbl{flex:1;font-size:15px;font-weight:500}
.set-val{font-size:14px;color:var(--t2)}
.set-input{background:none;border:none;font-size:15px;color:var(--text);text-align:right;width:100px;outline:none;font-family:inherit}
/* Language toggle */
.lang-toggle{display:flex;gap:6px}
.lang-btn{padding:5px 14px;border-radius:8px;border:1.5px solid var(--bd);background:var(--bg);font-size:13px;font-weight:600;color:var(--t2);cursor:pointer;font-family:inherit;transition:all .15s}
.lang-btn.active{background:var(--dark);color:#faf8f4;border-color:var(--dark)}
/* Job tags */
.job-tags{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0}
.job-tag{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;font-size:13px;font-weight:600;border:1px solid}
.job-tag .dot{width:7px;height:7px;border-radius:50%}
.job-tag-edit{background:none;border:none;color:inherit;opacity:.5;cursor:pointer;font-size:11px;padding:0;line-height:1}
.job-tag-del{background:none;border:none;color:inherit;opacity:.4;cursor:pointer;font-size:13px;padding:0;line-height:1}
.add-job-btn{padding:5px 13px;border-radius:20px;border:1.5px dashed var(--bd2);background:none;font-size:13px;color:var(--t2);cursor:pointer}
.job-form{display:none;width:100%;padding-top:12px;border-top:1px solid var(--bd);margin-top:2px}
.job-form-row{margin-bottom:10px}
.job-form-label{font-size:11px;font-weight:600;color:var(--t3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:7px}
.job-form-input{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--bd2);border-radius:10px;font-size:15px;font-family:inherit;color:var(--text);outline:none;transition:border-color .2s}
.job-form-input:focus{border-color:var(--dark)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.cswatch{width:32px;height:32px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s,border-color .15s;flex-shrink:0;outline:none}
.cswatch.sel{border-color:var(--dark);transform:scale(1.18)}
.cswatch:not(.sel):hover{transform:scale(1.08)}
.job-form-btns{display:flex;gap:8px;margin-top:14px}
.jfb-cancel{flex:1;padding:11px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;font-size:14px;font-weight:600;color:var(--t2);cursor:pointer;font-family:inherit}
.jfb-save{flex:2;padding:11px;background:var(--dark);color:#faf8f4;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.fab{position:fixed;right:20px;bottom:calc(var(--nav-h) + var(--safe) + 14px);width:50px;height:50px;background:var(--dark);border:none;border-radius:16px;box-shadow:0 4px 16px rgba(42,38,32,.28);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:90;transition:transform .15s}
.fab:active{transform:scale(.92)}
.fab svg{width:22px;height:22px;color:#faf8f4}
.modal-overlay{position:fixed;inset:0;background:rgba(42,38,32,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:200;display:none;align-items:flex-end}
.modal-overlay.open{display:flex;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg);border-radius:24px 24px 0 0;width:100%;max-height:90dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(16px + var(--safe));animation:slideUp .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:38px;height:4px;background:#d8d2c7;border-radius:2px;margin:12px auto 0}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px 8px}
.modal-title{font-size:20px;font-weight:700}
.modal-close{width:30px;height:30px;border-radius:50%;background:#ece8e1;border:none;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--t2)}
.day-shift-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--rs);padding:14px 16px;margin:0 20px 10px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .1s}
.day-shift-card:active{transform:scale(.98)}
.dsc-bar{width:3px;border-radius:2px;align-self:stretch;min-height:40px}
.dsc-info{flex:1;min-width:0}
.dsc-job{font-size:13px;font-weight:700;margin-bottom:2px}
.dsc-time{font-size:16px;font-weight:600;letter-spacing:-.01em}
.dsc-meta{font-size:12px;color:var(--t3);margin-top:2px}
.dsc-actions{display:flex;gap:8px;flex-shrink:0}
.dsc-edit-btn{width:32px;height:32px;border-radius:8px;background:var(--bg);border:1px solid var(--bd);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:14px}
.dsc-del-btn{width:32px;height:32px;border-radius:8px;background:#fce8e6;border:1px solid #f5c6c2;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#c0392b;font-size:14px}
.add-shift-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 20px;padding:14px;background:var(--card);border:1.5px dashed var(--bd2);border-radius:var(--rs);color:var(--t2);cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;width:calc(100% - 40px)}
.add-shift-btn:active{background:var(--bg)}
.form-group{padding:6px 22px}
.form-label{font-size:12px;font-weight:600;color:var(--t3);letter-spacing:.4px;margin-bottom:6px}
.form-input{width:100%;padding:13px 16px;background:var(--card);border:1px solid var(--bd2);border-radius:12px;font-size:16px;font-family:inherit;color:var(--text);outline:none;transition:border-color .2s;-webkit-appearance:none}
.form-input:focus{border-color:var(--dark)}
.time-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.time-sep{color:var(--t3);font-size:18px;padding-bottom:14px;text-align:center}
.job-picker{display:flex;flex-wrap:wrap;gap:8px}
.job-option{padding:8px 14px;border-radius:20px;border:1.5px solid var(--bd2);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;color:var(--text);transition:all .15s;display:flex;align-items:center;gap:6px}
.job-option.selected{border-color:transparent;color:white}
.jo-dot{width:7px;height:7px;border-radius:50%}
.hours-preview{display:flex;align-items:center;gap:10px;padding:12px 16px;margin:0 22px;background:var(--card);border:1px solid var(--bd);border-radius:12px}
.hp-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:8px}
.hp-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.hp-val{font-size:16px;font-weight:700}
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--t2);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;padding:0}
.form-actions{padding:16px 22px 0;display:flex;gap:10px}
.btn-save{flex:1;padding:15px;background:var(--dark);color:#faf8f4;border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-save:active{opacity:.8}
.btn-delete{padding:15px 20px;background:var(--card);color:#c0392b;border:1px solid #e5d2cc;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.form-nav-row{display:flex;gap:8px;padding:10px 22px 0}
.btn-nav{flex:1;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;font-size:13px;font-weight:600;color:var(--t2);cursor:pointer;font-family:inherit;transition:background .15s}
.btn-nav:active{background:var(--bd)}
.empty-state{text-align:center;padding:36px 20px;color:var(--t2)}
.empty-state .ei{font-size:44px;margin-bottom:10px}
.empty-state p{font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div id="app">

<!-- TODAY -->
<div class="page active" id="page-today">
  <div class="ph">
    <div>
      <div class="ph-title" id="today-greeting">排班</div>
      <div class="ph-sub" id="today-datestr"></div>
    </div>
    <button class="icon-btn" onclick="switchPage('settings')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
  <div class="week-strip" id="week-strip"></div>
  <div id="today-card-wrap"></div>
  <div class="sec-label" id="upcoming-label"></div>
  <div id="upcoming-list"></div>
</div>

<!-- CALENDAR -->
<div class="page" id="page-calendar">
  <div class="cal-nav">
    <button class="cal-nav-btn" id="cal-prev">‹</button>
    <div class="cal-month-lbl" id="cal-month-lbl"></div>
    <button class="cal-nav-btn" id="cal-next">›</button>
  </div>
  <div class="cal-grid">
    <div class="cal-wds" id="cal-wds"></div>
    <div class="cal-days" id="cal-days"></div>
    <div class="cal-legend" id="cal-legend"></div>
  </div>
  <div class="sec-label" id="cal-detail-lbl"></div>
  <div id="cal-detail-list"></div>
</div>

<!-- STATS -->
<div class="page" id="page-stats">
  <div class="ph"><div>
    <div class="ph-title" id="st-title">統計</div>
    <div class="ph-sub" id="st-sub">月份報表</div>
  </div></div>
  <div class="month-sel">
    <button class="month-sel-btn" id="stat-prev">‹</button>
    <div class="month-sel-lbl" id="stat-month-lbl"></div>
    <button class="month-sel-btn" id="stat-next">›</button>
  </div>
  <div class="salary-card">
    <div class="salary-lbl" id="st-salary-lbl">估算薪資（合計）</div>
    <div class="salary-val" id="salary-val">NT$ 0</div>
    <div class="salary-det" id="salary-det"></div>
  </div>

// ── Config & State ──
const JOB_PALETTE=['#3f9d72','#d9a23f','#6b62c4','#e05252','#0891b2','#f97316','#8b5cf6','#ec4899','#2563eb','#0d9488'];

const DEFAULT_CFG={
  lang:'zh',defaultRate:200,breakMinutes:0,otRate:1.34,stdHours:8,
  jobs:[
    {id:'j1',name:'工作1',color:'#3f9d72',hourlyRate:null},
    {id:'j2',name:'工作2',color:'#d9a23f',hourlyRate:null},
  ]
};

function migrateShifts(raw){
  if(!raw||typeof raw!=='object') return {};
  const out={};
  for(const[k,v]of Object.entries(raw)){
    if(Array.isArray(v)){out[k]=v;continue}
    if(v&&typeof v==='object'&&(v.start||v.end))
      out[k]=[{id:uid(),jobId:'j1',start:v.start||'',end:v.end||'',note:v.note||''}];
  }
  return out;
}
function uid(){return Math.random().toString(36).slice(2,10)}

let shifts=migrateShifts(ld(SK,{}));
let cfg={...DEFAULT_CFG,...ld(CK,{})};
if(!Array.isArray(cfg.jobs)||!cfg.jobs.length) cfg.jobs=DEFAULT_CFG.jobs;
if(!cfg.lang) cfg.lang='zh';

let lang=cfg.lang;
const L=()=>LANGS[lang];
const t=k=>L()[k]??LANGS.zh[k]??k;

// ── Utils ──
const pad=n=>String(n).padStart(2,'0');
const dKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const tKey=()=>dKey(new Date());
const pKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};

function calcH(s,e,brk=0){
  if(!s||!e) return 0;
  const[sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);
  let m=(eh*60+em)-(sh*60+sm);if(m<=0)m+=1440;
  return Math.max(0,(m-(brk||0))/60);
}
function fmtH(h){const hh=Math.floor(h),mm=Math.round((h-hh)*60);return L().hShort(hh,mm)}
function fmtHFull(h){const hh=Math.floor(h),mm=Math.round((h-hh)*60);return L().hFull(hh,mm)}
function autoClassLabel(start){
  if(!start) return '';
  const[h,m]=start.split(':').map(Number),mins=h*60+m;
  if(mins<630) return L().cat[0];
  if(mins<=810) return L().cat[1];
  return L().cat[2];
}

function getJob(id){return cfg.jobs.find(j=>j.id===id)||cfg.jobs[0]}
function jobRate(j){return(j.hourlyRate!=null?j.hourlyRate:cfg.defaultRate)||0}
function hex2light(hex,t){
  try{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return`rgb(${Math.round(r+(255-r)*t)},${Math.round(g+(255-g)*t)},${Math.round(b+(255-b)*t)})`}
  catch{return'#f7f4ee'}
}

}

// ── Today ──
function renderToday(){
  const now=new Date(),tk=dKey(now),h=now.getHours();
  const gi=h<6?0:h<12?1:h<18?2:3;
  document.getElementById('today-greeting').textContent=L().greet[gi];
  document.getElementById('today-datestr').textContent=
    `${now.getMonth()+1}/${now.getDate()} ${L().wdL[now.getDay()]}`;
  renderWeekStrip(now);
  renderTodayCard(tk,now);
  renderUpcoming(now);
}

function renderWeekStrip(now){
  const strip=document.getElementById('week-strip');strip.innerHTML='';
  const sun=new Date(now);sun.setDate(now.getDate()-now.getDay());
  for(let i=0;i<7;i++){
    const d=new Date(sun);d.setDate(sun.getDate()+i);
    const k=dKey(d),isT=k===dKey(now),ds=shifts[k]||[];
    const el=document.createElement('div');
    el.className='wdi'+(isT?' today-item':'');
    if(!isT&&ds.length){const jc=getJob(ds[0].jobId).color;el.style.background=hex2light(jc,.85);el.style.borderColor=hex2light(jc,.6)}
    const jcs=[...new Set(ds.map(s=>getJob(s.jobId).color))];
    const dotsHtml=jcs.slice(0,3).map(c=>`<span class="wdi-dot" style="background:${isT?'rgba(250,248,244,.55)':c}"></span>`).join('');
    const numCol=(!isT&&ds.length)?getJob(ds[0].jobId).color:'';
    el.innerHTML=`<div class="wdi-name">${L().wd[d.getDay()]}</div><div class="wdi-num" style="color:${isT?'#faf8f4':(numCol||'var(--text)')}">${d.getDate()}</div><div class="wdi-dots">${dotsHtml||'<span style="width:6px;height:6px"></span>'}</div>`;
    el.onclick=()=>openDayModal(k);strip.appendChild(el);
  }
}

function renderTodayCard(tk,now){
  const wrap=document.getElementById('today-card-wrap');
  const ds=(shifts[tk]||[]).slice().sort((a,b)=>a.start.localeCompare(b.start));
  if(!ds.length){
    wrap.innerHTML=`<div class="today-card"><div class="tc-label"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${L().todayLbl(now.getMonth()+1,now.getDate(),L().wd[now.getDay()])}</div><div class="tc-empty">${L().todayEmpty}</div><button class="tc-add" onclick="openDayModal('${tk}')">${L().todayAdd}</button></div>`;
    return;
  }
  const html=ds.map(s=>{
    const job=getJob(s.jobId),hrs=calcH(s.start,s.end,cfg.breakMinutes),cat=autoClassLabel(s.start);
    return`<div class="tc-shift"><span class="tc-job-dot" style="background:${job.color}"></span><span class="tc-job-name" style="background:${hex2light(job.color,.82)};color:${job.color}">${job.name}</span><div class="tc-time">${s.start} – ${s.end}</div><div><div class="tc-hrs">${cat} · ${fmtH(hrs)}</div>${s.note?`<div class="tc-note-txt">${s.note}</div>`:''}</div></div>`;
  }).join('');
  wrap.innerHTML=`<div class="today-card" onclick="openDayModal('${tk}')"><div class="tc-label"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${L().todayLbl(now.getMonth()+1,now.getDate(),L().wd[now.getDay()])}</div>${html}</div>`;
}

function renderUpcoming(now){
  const label=document.getElementById('upcoming-label'),list=document.getElementById('upcoming-list');
  list.innerHTML='';
  const items=[];
  for(let i=1;i<=7;i++){const d=new Date(now);d.setDate(now.getDate()+i);const k=dKey(d);(shifts[k]||[]).forEach(s=>items.push({key:k,date:d,s}))}
  if(!items.length){
    label.textContent='';
    list.innerHTML=`<div class="empty-state"><div class="ei">🗓️</div><p>${L().noUpcoming}<br>${L().noUpcomingSub}</p></div>`;
    return;
  }
  label.textContent=L().upcoming;
  items.sort((a,b)=>a.key.localeCompare(b.key)||a.s.start.localeCompare(b.s.start)).forEach(({key,date,s})=>{
    const job=getJob(s.jobId),hrs=calcH(s.start,s.end,cfg.breakMinutes);
    const el=document.createElement('div');el.className='shift-item';
    el.innerHTML=`<div class="s-bar" style="background:${job.color}"></div><div class="s-info"><div class="s-name">${job.name}</div><div class="s-time">${s.start} – ${s.end}</div><div class="s-meta">${L().wd[date.getDay()]} ${date.getMonth()+1}/${date.getDate()}${s.note?' · '+s.note:''}</div></div><div><div class="s-hrs">${fmtH(hrs)}</div><div class="s-hrs-lbl">h</div></div>`;
    el.onclick=()=>openDayModal(key);list.appendChild(el);
  });
}

// ── Calendar ──
let calY=new Date().getFullYear(),calM=new Date().getMonth();
document.getElementById('cal-prev').onclick=()=>{calM--;if(calM<0){calM=11;calY--}renderCalendar()};
document.getElementById('cal-next').onclick=()=>{calM++;if(calM>11){calM=0;calY++}renderCalendar()};

function renderCalendar(){
  document.getElementById('cal-month-lbl').innerHTML=`${calY} <span>${L().mon[calM]}</span>`;
  // weekday headers
  const wdsEl=document.getElementById('cal-wds');wdsEl.innerHTML='';
  L().wd.forEach((w,i)=>{const d=document.createElement('div');d.className='cal-wd';d.textContent=w;if(i===0)d.style.color='rgba(192,57,43,.65)';if(i===6)d.style.color='rgba(91,130,216,.75)';wdsEl.appendChild(d)});

  const first=new Date(calY,calM,1),last=new Date(calY,calM+1,0),tok=tKey();
  const grid=document.getElementById('cal-days');grid.innerHTML='';

  const addCell=(date,other)=>{
    const k=dKey(date),ds=(shifts[k]||[]).slice().sort((a,b)=>a.start.localeCompare(b.start));
    const dow=date.getDay(),el=document.createElement('div');
    let cls='cal-day';if(other)cls+=' other-m';if(k===tok)cls+=' today';if(dow===0)cls+=' sunday';if(dow===6)cls+=' saturday';
    el.className=cls;
    if(ds.length&&!other&&k!==tok){const jc=getJob(ds[0].jobId).color;el.style.background=hex2light(jc,.86);el.style.border=`1px solid ${hex2light(jc,.6)}`}
    let inner=`<span class="day-num">${date.getDate()}</span>`;
    if(ds.length){
      if(ds.length===1){
        const jc=getJob(ds[0].jobId).color,dotBg=k===tok?'rgba(42,38,32,.25)':jc,txtCol=k===tok?'var(--dark)':jc;
        inner+=`<span class="day-time-row" style="color:${txtCol}">${ds[0].start}</span><span class="day-dot" style="background:${dotBg};position:absolute;top:6px;right:6px"></span>`;
      } else {
        const dots=ds.slice(0,3).map(s=>`<span class="day-dot" style="background:${k===tok?'rgba(42,38,32,.25)':getJob(s.jobId).color}"></span>`).join('');
        const ex=ds.length>3?`<span style="font-size:8px;color:var(--t3)">+${ds.length-3}</span>`:'';
        inner+=`<div class="day-dots-row">${dots}${ex}</div>`;
      }
    } else inner+=`<span class="day-add">+</span>`;
    el.innerHTML=inner;el.onclick=()=>openDayModal(k);grid.appendChild(el);
  };

  for(let i=0;i<first.getDay();i++) addCell(new Date(calY,calM,-first.getDay()+i+1),true);
  for(let d=1;d<=last.getDate();d++) addCell(new Date(calY,calM,d),false);
  const trail=7-((first.getDay()+last.getDate())%7||7);
  for(let i=1;i<=trail;i++) addCell(new Date(calY,calM+1,i),true);

  const leg=document.getElementById('cal-legend');leg.innerHTML='';
  cfg.jobs.forEach(j=>{const d=document.createElement('div');d.className='legend-item';d.innerHTML=`<span class="legend-dot" style="background:${j.color}"></span>${j.name}`;leg.appendChild(d)});
  renderCalDetail();
}

function renderCalDetail(){
  const label=document.getElementById('cal-detail-lbl'),list=document.getElementById('cal-detail-list');
  list.innerHTML='';
  const entries=Object.entries(shifts).filter(([k])=>{const d=pKey(k);return d.getFullYear()===calY&&d.getMonth()===calM}).sort(([a],[b])=>a.localeCompare(b));
  const total=entries.reduce((acc,[,ds])=>acc+ds.length,0);
  if(!total){label.textContent='';return}
  label.textContent=L().monShifts(entries.length,total);
  entries.forEach(([k,ds])=>{
    const date=pKey(k);
    ds.slice().sort((a,b)=>a.start.localeCompare(b.start)).forEach(s=>{
      const job=getJob(s.jobId),hrs=calcH(s.start,s.end,cfg.breakMinutes);
      const el=document.createElement('div');el.className='shift-item';
      el.innerHTML=`<div class="s-bar" style="background:${job.color}"></div><div class="s-info"><div class="s-name">${job.name}</div><div class="s-time">${s.start} – ${s.end}</div><div class="s-meta">${date.getMonth()+1}/${date.getDate()} ${L().wd[date.getDay()]}${s.note?' · '+s.note:''}</div></div><div><div class="s-hrs">${fmtH(hrs)}</div><div class="s-hrs-lbl">h</div></div>`;
      el.onclick=()=>openDayModal(k);list.appendChild(el);
    });
  });
}

// ── Stats ──
let statY=new Date().getFullYear(),statM=new Date().getMonth();
document.getElementById('stat-prev').onclick=()=>{statM--;if(statM<0){statM=11;statY--}renderStats()};
document.getElementById('stat-next').onclick=()=>{statM++;if(statM>11){statM=0;statY++}renderStats()};

function renderStats(){
  document.getElementById('stat-month-lbl').textContent=`${statY} ${L().mon[statM]}`;
  const entries=Object.entries(shifts).filter(([k])=>{const d=pKey(k);return d.getFullYear()===statY&&d.getMonth()===statM});
  let totalH=0,sc=0,salary=0;const byJob={};
  entries.forEach(([,ds])=>ds.forEach(s=>{
    const hrs=calcH(s.start,s.end,cfg.breakMinutes),job=getJob(s.jobId),rate=jobRate(job),std=cfg.stdHours||8,ot=cfg.otRate||1.34;
    const pay=hrs<=std?hrs*rate:std*rate+(hrs-std)*rate*ot;
    totalH+=hrs;sc++;salary+=pay;
    if(!byJob[s.jobId]) byJob[s.jobId]={hours:0,count:0,pay:0};
    byJob[s.jobId].hours+=hrs;byJob[s.jobId].count++;byJob[s.jobId].pay+=pay;
  }));
  const days=entries.length,avg=days?totalH/days:0;
  document.getElementById('salary-val').textContent=`NT$ ${Math.round(salary).toLocaleString()}`;
  document.getElementById('salary-det').textContent=L().salDet(days,sc,totalH.toFixed(1));
  document.getElementById('stat-hours').textContent=totalH.toFixed(1);
  document.getElementById('stat-days').textContent=days;
  document.getElementById('stat-shifts').textContent=sc;
  document.getElementById('stat-avg').textContent=avg.toFixed(1);
  const bl=document.getElementById('breakdown-list');bl.innerHTML='';
  if(!Object.keys(byJob).length){bl.innerHTML=`<div style="padding:20px;text-align:center;color:var(--t3);font-size:14px">${L().noMonthShifts}</div>`;return}
  Object.entries(byJob).sort(([,a],[,b])=>b.hours-a.hours).forEach(([jid,data])=>{
    const job=getJob(jid);const el=document.createElement('div');el.className='bd-item';
    el.innerHTML=`<div class="bd-dot" style="background:${job.color}"></div><div class="bd-name">${job.name}</div><div class="bd-cnt" style="margin-right:10px">${data.count} ${L().sUnit}</div><div class="bd-hrs" style="margin-right:12px;color:${job.color}">${data.hours.toFixed(1)}h</div><div class="bd-hrs" style="font-size:12px;color:var(--t2)">NT$${Math.round(data.pay).toLocaleString()}</div>`;
    bl.appendChild(el);
  });
}

document.getElementById('btn-add-job').onclick=()=>openJobForm(null);

let _jobId=null,_selColor=null;
function openJobForm(jobId){
  _jobId=jobId;
  const ex=jobId?cfg.jobs.find(j=>j.id===jobId):null;
  const used=cfg.jobs.filter(j=>j.id!==jobId).map(j=>j.color);
  _selColor=ex?.color||JOB_PALETTE.find(c=>!used.includes(c))||JOB_PALETTE[0];
  document.getElementById('new-job-name').value=ex?.name||'';
  document.getElementById('new-job-rate').value=ex?.hourlyRate!=null?ex.hourlyRate:'';
  document.getElementById('jfb-save-btn').textContent=jobId?t('jfSave'):t('jfAdd');
  document.getElementById('btn-add-job').style.display='none';
  document.getElementById('job-form').style.display='block';
  renderSwatches();
  document.getElementById('new-job-name').focus();
}
function cancelJobForm(){
  document.getElementById('job-form').style.display='none';
  document.getElementById('btn-add-job').style.display='';
  _jobId=null;_selColor=null;
}
function confirmJobForm(){
  const name=document.getElementById('new-job-name').value.trim().slice(0,6);
  if(!name){document.getElementById('new-job-name').focus();return}
  const rateRaw=document.getElementById('new-job-rate').value.trim();
  const hourlyRate=rateRaw===''?null:(parseFloat(rateRaw)||null);
  if(_jobId){const j=cfg.jobs.find(x=>x.id===_jobId);if(j){j.name=name;j.color=_selColor;j.hourlyRate=hourlyRate}}
  else cfg.jobs.push({id:'j'+Date.now(),name,color:_selColor,hourlyRate});
  sv(CK,cfg);cancelJobForm();renderJobTags();
}
function renderSwatches(){
  const wrap=document.getElementById('color-swatches');wrap.innerHTML='';
  JOB_PALETTE.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='cswatch'+(c===_selColor?' sel':'');

    btn.innerHTML=c===_selColor?`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`:'';

function saveShift(){
  const selBtn=document.querySelector('#f-job-picker .job-option.selected');
  const jobId=selBtn?(cfg.jobs.find(j=>selBtn.textContent.trim().includes(j.name))?.id||cfg.jobs[0].id):cfg.jobs[0].id;
  const start=document.getElementById('f-start').value,end=document.getElementById('f-end').value;
  const note=document.getElementById('f-note').value.trim();
  if(!start||!end){alert(t('fillTime'));return}
  if(!shifts[modalDateKey]) shifts[modalDateKey]=[];
  if(editingShiftId){
    const idx=shifts[modalDateKey].findIndex(s=>s.id===editingShiftId);
    if(idx>-1) shifts[modalDateKey][idx]={id:editingShiftId,jobId,start,end,note};
  } else shifts[modalDateKey].push({id:uid(),jobId,start,end,note});
  sv(SK,shifts);showDayView();refreshAll();
}

function quickDeleteShift(shiftId){
  if(!confirm(t('delShift'))) return;
  shifts[modalDateKey]=(shifts[modalDateKey]||[]).filter(s=>s.id!==shiftId);
  if(!shifts[modalDateKey].length) delete shifts[modalDateKey];
  sv(SK,shifts);renderDayShiftList();refreshAll();
}
function deleteShift(){if(!editingShiftId)return;quickDeleteShift(editingShiftId);showDayView()}

function refreshAll(){
  if(currentPage==='today') renderToday();
  if(currentPage==='calendar') renderCalendar();
  if(currentPage==='stats') renderStats();
}

// ── Init ──
(function(){
  if('serviceWorker'in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  calY=statY=new Date().getFullYear();calM=statM=new Date().getMonth();
  applyLang();
  renderToday();
})();
</script>
