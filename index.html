<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="班表">
<link rel="manifest" href="manifest.json">
<title>班表</title>
<style>
  :root {
    --bg:    #faf8f4;
    --card:  #ffffff;
    --dark:  #2a2620;
    --text:  #2a2620;
    --text2: #6b655c;
    --text3: #a8a299;
    --bd:    #ece8e1;
    --bd2:   #e5dfd4;
    --day-empty: #f7f4ee;
    --radius: 20px;
    --radius-sm: 12px;
    --nav-h: 72px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, 'SF Pro Text', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    color: var(--text);
    overflow: hidden;
  }

  #app { height: 100dvh; display: flex; flex-direction: column; }

  .page {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px);
    display: none;
  }
  .page.active { display: block; }

  @supports(padding: max(0px)) {
    .page { padding-bottom: calc(var(--nav-h) + max(var(--safe-bottom), 16px)); }
  }

  /* ── Nav ── */
  nav {
    position: fixed; bottom:0; left:0; right:0;
    height: calc(var(--nav-h) + var(--safe-bottom));
    background: rgba(250,248,244,.94);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--bd);
    display: flex; align-items: flex-start;
    padding-top: 8px; z-index: 100;
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; gap: 4px; padding: 4px 0;
    background: none; border: none; cursor: pointer;
    color: var(--text3); font-size: 10px; font-weight: 600;
    letter-spacing: .2px; transition: color .2s;
  }
  .nav-btn.active { color: var(--dark); }
  .nav-btn svg { width: 22px; height: 22px; }

  /* ── Page header ── */
  .page-header {
    padding: 20px 20px 0;
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  .page-title { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
  .page-subtitle {
    font-size: 12px; color: var(--text3); margin-top: 2px;
    letter-spacing: .08em; text-transform: uppercase; font-weight: 500;
  }
  .icon-btn {
    background: var(--card); border: 1px solid var(--bd); border-radius: 12px;
    padding: 10px; display: flex; align-items: center; justify-content: center;
    color: var(--text2); cursor: pointer;
  }

  /* ── Today dark card ── */
  .today-card {
    background: var(--dark); color: #faf8f4;
    border-radius: var(--radius); padding: 18px 20px;
    margin: 14px 20px 0; cursor: pointer;
  }
  .tc-label {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: #b5ac9f; margin-bottom: 10px; font-weight: 500;
  }
  .tc-top { display: flex; align-items: center; gap: 10px; margin-bottom: 3px; }
  .tc-time { font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
  .tc-badge {
    font-size: 12px; font-weight: 700; color: #fff;
    padding: 3px 10px; border-radius: 8px;
  }
  .tc-meta { font-size: 13px; color: #c9c0b3; }
  .tc-note { color: #e8c87a; }
  .tc-empty { font-size: 15px; color: #8a847a; padding: 2px 0 4px; }
  .tc-add {
    margin-top: 12px;
    background: rgba(250,248,244,.12);
    border: 1px solid rgba(250,248,244,.2);
    color: #faf8f4; border-radius: 10px;
    padding: 8px 16px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }

  /* ── Week strip ── */
  .week-strip {
    display: flex; gap: 6px;
    margin: 14px 20px 0;
    overflow-x: auto; scrollbar-width: none; padding-bottom: 2px;
  }
  .week-strip::-webkit-scrollbar { display: none; }
  .week-day-item {
    flex-shrink: 0; display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    width: 42px; padding: 8px 0;
    border-radius: 12px; cursor: pointer;
    border: 1px solid transparent;
    transition: all .15s;
  }
  .week-day-item.today-item { background: var(--dark); border-color: var(--dark); }
  .wdi-name { font-size: 10px; font-weight: 600; color: var(--text3); letter-spacing: .3px; }
  .wdi-num  { font-size: 16px; font-weight: 600; color: var(--text); }
  .wdi-dot  { width: 6px; height: 6px; border-radius: 50%; }
  .week-day-item.today-item .wdi-name,
  .week-day-item.today-item .wdi-num { color: #faf8f4; }

  /* ── Shift list items ── */
  .section-label {
    font-size: 11.5px; font-weight: 600; color: var(--text3);
    text-transform: uppercase; letter-spacing: .8px;
    padding: 16px 20px 8px;
  }
  .shift-item {
    background: var(--card); margin: 0 20px 8px;
    border-radius: var(--radius-sm); padding: 14px 16px;
    display: flex; align-items: center; gap: 14px;
    border: 1px solid var(--bd); cursor: pointer;
    transition: transform .1s;
  }
  .shift-item:active { transform: scale(.98); }
  .shift-bar { width: 3px; border-radius: 2px; align-self: stretch; min-height: 40px; }
  .shift-info { flex: 1; min-width: 0; }
  .shift-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .shift-time { font-size: 13px; color: var(--text2); }
  .shift-meta { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .shift-hrs { font-size: 20px; font-weight: 700; color: var(--text); text-align: right; letter-spacing: -.01em; }
  .shift-hrs-lbl { font-size: 10px; color: var(--text3); text-align: right; }

  /* ── Calendar ── */
  .cal-nav {
    display: flex; align-items: center;
    justify-content: space-between; padding: 20px 20px 0;
  }
  .cal-nav-btn {
    width: 36px; height: 36px;
    border: 1px solid var(--bd); background: var(--card);
    border-radius: 10px; cursor: pointer;
    color: var(--text2); font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .cal-month-label { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .cal-month-label span { color: var(--text2); font-weight: 500; }

  .cal-grid {
    margin: 14px 20px 0;
    background: var(--card); border: 1px solid var(--bd);
    border-radius: var(--radius); padding: 12px;
  }
  .cal-weekdays {
    display: grid; grid-template-columns: repeat(7,1fr);
    margin-bottom: 6px;
  }
  .cal-wd {
    text-align: center; font-size: 11px; font-weight: 600;
    color: var(--text3); padding: 4px 0; letter-spacing: .3px;
  }
  .cal-wd:first-child { color: rgba(192,57,43,.65); }
  .cal-wd:last-child  { color: rgba(91,130,216,.75); }

  .cal-days { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }

  .cal-day {
    aspect-ratio: 1 / 1.15; border: none;
    border-radius: 12px; background: var(--day-empty);
    display: flex; flex-direction: column;
    align-items: center; padding: 6px 2px;
    cursor: pointer; transition: transform .1s;
    position: relative;
  }
  .cal-day:active { transform: scale(.94); }
  .cal-day.other-month { opacity: .3; }
  .cal-day.today {
    background: var(--card) !important;
    border: 2px solid var(--dark) !important;
  }
  .cal-day.sunday  .day-num { color: rgba(192,57,43,.8); }
  .cal-day.saturday .day-num { color: rgba(46,95,163,.8); }
  .cal-day.today .day-num { color: var(--dark) !important; font-weight: 700; }

  .day-num { font-size: 13px; font-weight: 600; line-height: 1; color: #8a847a; }
  .day-shift-time {
    font-size: 9px; font-weight: 600;
    line-height: 1.3; margin-top: auto; text-align: center;
  }
  .day-dot {
    width: 5px; height: 5px; border-radius: 50%;
    position: absolute; top: 6px; right: 6px;
  }
  .day-add { margin-top: auto; color: #d4cdbf; font-size: 13px; }

  .cal-legend {
    display: flex; justify-content: center; gap: 18px;
    padding: 10px 0 2px; margin-top: 8px;
    border-top: 1px solid var(--bd);
  }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 11.5px; color: var(--text2); font-weight: 500;
  }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* ── Stats ── */
  .salary-card {
    background: var(--dark); color: #faf8f4;
    border-radius: var(--radius); padding: 20px 22px;
    margin: 14px 20px 0;
  }
  .salary-lbl { font-size: 12px; color: #b5ac9f; margin-bottom: 4px; font-weight: 500; }
  .salary-val { font-size: 36px; font-weight: 800; letter-spacing: -.03em; }
  .salary-det { font-size: 12px; color: #c9c0b3; margin-top: 4px; }

  .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 20px 0; }
  .stat-card {
    background: var(--card); border: 1px solid var(--bd);
    border-radius: var(--radius-sm); padding: 16px 14px;
  }
  .stat-icon {
    width: 32px; height: 32px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; margin-bottom: 8px;
  }
  .stat-value { font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
  .stat-label { font-size: 12px; color: var(--text2); margin-top: 2px; }

  .card {
    background: var(--card); border: 1px solid var(--bd);
    border-radius: var(--radius-sm); padding: 4px 16px;
    margin: 0 20px;
  }
  .breakdown-item {
    display: flex; align-items: center; padding: 11px 0;
    border-bottom: 1px solid var(--bd); gap: 10px;
  }
  .breakdown-item:last-child { border-bottom: none; }
  .breakdown-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .breakdown-name { flex: 1; font-size: 14px; font-weight: 500; }
  .breakdown-cnt { font-size: 13px; color: var(--text2); }
  .breakdown-hrs { font-size: 14px; font-weight: 600; }

  /* ── Month selector ── */
  .month-selector {
    display: flex; align-items: center; justify-content: center;
    gap: 16px; padding: 14px 20px 0;
  }
  .month-sel-btn {
    width: 30px; height: 30px;
    border: 1px solid var(--bd); background: var(--card);
    border-radius: 8px; cursor: pointer; font-size: 14px;
    color: var(--text2); display: flex; align-items: center; justify-content: center;
  }
  .month-sel-label { font-size: 16px; font-weight: 600; }

  /* ── Settings ── */
  .settings-section { margin: 0 20px; }
  .settings-group {
    background: var(--card); border: 1px solid var(--bd);
    border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 18px;
  }
  .settings-row {
    display: flex; align-items: center;
    padding: 15px 16px; border-bottom: 1px solid var(--bd); gap: 12px;
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-icon {
    width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }
  .settings-label { flex: 1; font-size: 15px; font-weight: 500; }
  .settings-value { font-size: 14px; color: var(--text2); }
  .settings-input {
    background: none; border: none; font-size: 15px;
    color: var(--text); text-align: right; width: 100px;
    outline: none; font-family: inherit;
  }

  .type-tags { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0; }
  .type-tag {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 11px; border-radius: 20px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .type-tag .dot { width: 7px; height: 7px; border-radius: 50%; }
  .type-tag-del {
    background: none; border: none; color: inherit;
    opacity: .4; cursor: pointer; font-size: 13px; padding: 0; line-height: 1;
  }
  .add-type-btn {
    padding: 5px 13px; border-radius: 20px;
    border: 1.5px dashed var(--bd2);
    background: none; font-size: 13px; color: var(--text2); cursor: pointer;
  }

  /* ── FAB ── */
  .fab {
    position: fixed; right: 20px;
    bottom: calc(var(--nav-h) + var(--safe-bottom) + 14px);
    width: 50px; height: 50px;
    background: var(--dark); border: none; border-radius: 16px;
    box-shadow: 0 4px 16px rgba(42,38,32,.28);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    z-index: 90; transition: transform .15s;
  }
  .fab:active { transform: scale(.92); }
  .fab svg { width: 22px; height: 22px; color: #faf8f4; }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(42,38,32,.45);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    z-index: 200; display: none; align-items: flex-end;
  }
  .modal-overlay.open { display: flex; animation: fadeIn .15s; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  .modal {
    background: var(--bg); border-radius: 24px 24px 0 0;
    width: 100%; max-height: 90dvh; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: calc(16px + var(--safe-bottom));
    animation: slideUp .28s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  .modal-handle {
    width: 38px; height: 4px; background: #d8d2c7;
    border-radius: 2px; margin: 12px auto 0;
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 22px 8px;
  }
  .modal-title { font-size: 20px; font-weight: 700; }
  .modal-close {
    width: 30px; height: 30px; border-radius: 50%;
    background: #ece8e1; border: none; cursor: pointer;
    font-size: 15px; display: flex; align-items: center; justify-content: center;
    color: var(--text2);
  }

  .form-group { padding: 6px 22px; }
  .form-label { font-size: 12px; font-weight: 600; color: var(--text3); letter-spacing: .4px; margin-bottom: 6px; }
  .form-input {
    width: 100%; padding: 13px 16px;
    background: var(--card); border: 1px solid var(--bd2);
    border-radius: 12px; font-size: 16px; font-family: inherit;
    color: var(--text); outline: none; transition: border-color .2s;
    -webkit-appearance: none;
  }
  .form-input:focus { border-color: var(--dark); }

  .time-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
  .time-sep { color: var(--text3); font-size: 18px; padding-bottom: 14px; text-align: center; }

  .type-picker { display: flex; flex-wrap: wrap; gap: 8px; }
  .type-option {
    padding: 7px 14px; border-radius: 20px;
    border: 1.5px solid var(--bd2);
    background: var(--card); font-size: 13px; font-weight: 600;
    cursor: pointer; color: var(--text);
    transition: all .15s; display: flex; align-items: center; gap: 6px;
  }
  .type-option.selected { border-color: transparent; color: white; }
  .t-dot { width: 7px; height: 7px; border-radius: 50%; }

  .hours-preview {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; margin: 0 22px;
    background: var(--card); border: 1px solid var(--bd);
    border-radius: 12px;
  }
  .hp-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 8px;
  }
  .hp-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .hp-sep { font-size: 13px; color: var(--bd2); }
  .hp-val { font-size: 16px; font-weight: 700; }
  .hp-unit { font-size: 13px; color: var(--text2); }

  .form-actions { padding: 16px 22px 0; display: flex; gap: 10px; }
  .btn-save {
    flex: 1; padding: 15px;
    background: var(--dark); color: #faf8f4;
    border: none; border-radius: 14px;
    font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn-save:active { opacity: .8; }
  .btn-delete {
    padding: 15px 20px;
    background: var(--card); color: #c0392b;
    border: 1px solid #e5d2cc; border-radius: 14px;
    font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
  }

  .empty-state { text-align: center; padding: 36px 20px; color: var(--text2); }
  .empty-state .ei { font-size: 44px; margin-bottom: 10px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }
  .empty-add {
    margin-top: 12px; background: var(--dark); color: #faf8f4;
    border: none; border-radius: 10px; padding: 10px 20px;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
</style>
</head>
<body>
<div id="app">

  <!-- ══ TODAY ══ -->
  <div class="page active" id="page-today">
    <div class="page-header">
      <div>
        <div class="page-title" id="today-greeting">排班</div>
        <div class="page-subtitle" id="today-datestr"></div>
      </div>
      <button class="icon-btn" onclick="switchPage('settings')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
    <div class="week-strip" id="week-strip"></div>
    <div id="today-card-wrap"></div>
    <div class="section-label" id="upcoming-label"></div>
    <div id="upcoming-list"></div>
  </div>

  <!-- ══ CALENDAR ══ -->
  <div class="page" id="page-calendar">
    <div class="cal-nav">
      <button class="cal-nav-btn" id="cal-prev">‹</button>
      <div class="cal-month-label" id="cal-month-label"></div>
      <button class="cal-nav-btn" id="cal-next">›</button>
    </div>
    <div class="cal-grid">
      <div class="cal-weekdays">
        <div class="cal-wd">日</div><div class="cal-wd">一</div><div class="cal-wd">二</div>
        <div class="cal-wd">三</div><div class="cal-wd">四</div><div class="cal-wd">五</div>
        <div class="cal-wd">六</div>
      </div>
      <div class="cal-days" id="cal-days"></div>
      <div class="cal-legend" id="cal-legend"></div>
    </div>
    <div class="section-label" id="cal-detail-label"></div>
    <div id="cal-detail-list"></div>
  </div>

  <!-- ══ STATS ══ -->
  <div class="page" id="page-stats">
    <div class="page-header">
      <div>
        <div class="page-title">統計</div>
        <div class="page-subtitle">月份報表</div>
      </div>
    </div>
    <div class="month-selector">
      <button class="month-sel-btn" id="stat-prev">‹</button>
      <div class="month-sel-label" id="stat-month-label"></div>
      <button class="month-sel-btn" id="stat-next">›</button>
    </div>
    <div class="salary-card">
      <div class="salary-lbl">估算薪資</div>
      <div class="salary-val" id="salary-val">NT$ 0</div>
      <div class="salary-det" id="salary-det"></div>
    </div>
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-icon" style="background:#eaf3ef">⏱️</div>
        <div class="stat-value" id="stat-hours">0</div>
        <div class="stat-label">總工時（小時）</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#fbf2e3">📅</div>
        <div class="stat-value" id="stat-days">0</div>
        <div class="stat-label">出勤天數</div>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-icon" style="background:#ecebf5">⌛</div>
        <div class="stat-value" id="stat-avg">0</div>
        <div class="stat-label">平均每日時數</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#f0ebe0">💰</div>

<script>
// ══ STORAGE ══
const STORE_SHIFTS   = 'bantu_shifts_v2';
const STORE_SETTINGS = 'bantu_settings_v2';
const load = (k, fb) => { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; } catch { return fb; } };
const save = (k, v)  => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

// ══ DEFAULTS ══
const DEFAULT_SETTINGS = {
  hourlyRate: 200,
  breakMinutes: 0,
  otRate: 1.34,
  stdHours: 8,
  shiftTypes: [
    { id:'s1', name:'早班', color:'#3f9d72', bg:'#eaf3ef', border:'#bcdccd', textColor:'#2e6b4f' },
    { id:'s2', name:'中班', color:'#d9a23f', bg:'#fbf2e3', border:'#ecd9b4', textColor:'#8a6420' },
    { id:'s3', name:'晚班', color:'#6b62c4', bg:'#ecebf5', border:'#cfccea', textColor:'#4a4392' },
    { id:'s4', name:'大夜', color:'#374151', bg:'#f1f2f4', border:'#d1d5db', textColor:'#374151' },
    { id:'s5', name:'休假', color:'#0891b2', bg:'#e0f2fe', border:'#bae6fd', textColor:'#0369a1' },
  ]
};

let shifts   = load(STORE_SHIFTS,   {});
let settings = load(STORE_SETTINGS, {});
settings = { ...DEFAULT_SETTINGS, ...settings };

// ══ UTILS ══
const pad = n => String(n).padStart(2,'0');
const dateKey  = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey = () => dateKey(new Date());
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };

const WEEKDAYS = ['週日','週一','週二','週三','週四','週五','週六'];
const WD_SHORT = ['日','一','二','三','四','五','六'];
const MONTHS   = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function calcHours(start, end, breakMin = 0) {
  if (!start || !end) return 0;
  const [sh,sm] = start.split(':').map(Number);
  const [eh,em] = end.split(':').map(Number);
  let mins = (eh*60+em) - (sh*60+sm);
  if (mins <= 0) mins += 24*60;
  return Math.max(0, (mins - (breakMin||0)) / 60);
}

function fmtHours(h) {
  const hh = Math.floor(h), mm = Math.round((h-hh)*60);
  return mm === 0 ? `${hh}h` : `${hh}h${mm}m`;
}

function fmtHoursFull(h) {
  const hh = Math.floor(h), mm = Math.round((h-hh)*60);
  return mm === 0 ? `${hh} 小時` : `${hh} 小時 ${mm} 分`;
}

function fmtDateFull(d) {
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${WEEKDAYS[d.getDay()]}`;
}

function getShiftType(id) {
  return settings.shiftTypes.find(t => t.id === id) || settings.shiftTypes[0];
}

// Returns {bg, border, text, dot} for a shift type
function typeColors(type) {
  if (type.bg) return { bg: type.bg, border: type.border, text: type.textColor, dot: type.color };
  // fallback for custom types without explicit bg fields
  return { bg: hex2light(type.color, .88), border: hex2light(type.color, .65), text: type.color, dot: type.color };
}

function hex2light(hex, t) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.round(r+(255-r)*t)},${Math.round(g+(255-g)*t)},${Math.round(b+(255-b)*t)})`;
}

// Auto-classify shift by start time
function autoClassify(start) {
  if (!start) return settings.shiftTypes[0];
  const [h,m] = start.split(':').map(Number);
  const t = h*60+m;
  if (t < 10*60+30) return settings.shiftTypes.find(x=>x.name==='早班') || settings.shiftTypes[0];
  if (t <= 13*60+30) return settings.shiftTypes.find(x=>x.name==='中班') || settings.shiftTypes[1];
  return settings.shiftTypes.find(x=>x.name==='晚班') || settings.shiftTypes[2];
}

// ══ NAVIGATION ══
let currentPage = 'today';
function switchPage(page) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  document.querySelector(`.nav-btn[data-page="${page}"]`).classList.add('active');
  document.getElementById('fab-add').style.display = page === 'settings' ? 'none' : 'flex';
  currentPage = page;
  if (page==='today')    renderToday();
  if (page==='calendar') renderCalendar();
  if (page==='stats')    renderStats();
  if (page==='settings') renderSettings();
}

// ══ TODAY ══
function renderToday() {
  const now = new Date();
  const tk  = dateKey(now);
  const h   = now.getHours();
  document.getElementById('today-greeting').textContent =
    h < 6 ? '深夜 🌙' : h < 12 ? '早安 ☀️' : h < 18 ? '午安 🌤' : '晚安 🌇';
  document.getElementById('today-datestr').textContent =
    `${now.getMonth()+1}/${now.getDate()} ${WEEKDAYS[now.getDay()]}`;

  renderWeekStrip(now);
  renderTodayCard(tk, now);
  renderUpcoming(now);
}

function renderWeekStrip(now) {
  const strip = document.getElementById('week-strip');
  strip.innerHTML = '';
  const sunday = new Date(now); sunday.setDate(now.getDate() - now.getDay());
  for (let i = 0; i < 7; i++) {
    const d = new Date(sunday); d.setDate(sunday.getDate()+i);
    const k = dateKey(d);
    const isToday = k === dateKey(now);
    const sh = shifts[k];
    const el = document.createElement('div');
    el.className = 'week-day-item' + (isToday ? ' today-item' : '');
    if (sh && !isToday) {
      const c = typeColors(getShiftType(sh.typeId));
      el.style.background = c.bg;
      el.style.borderColor = c.border;
    }
    const dotColor = sh ? typeColors(getShiftType(sh.typeId)).dot : 'transparent';
    const numColor = (sh && !isToday) ? typeColors(getShiftType(sh.typeId)).dot : '';
    el.innerHTML = `
      <div class="wdi-name">${WD_SHORT[d.getDay()]}</div>
      <div class="wdi-num" style="color:${isToday?'#faf8f4':(numColor||'var(--text)')}">${d.getDate()}</div>
      <div class="wdi-dot" style="background:${isToday?'rgba(250,248,244,.55)':(sh?dotColor:'transparent')}"></div>`;
    el.onclick = () => openModal(k);
    strip.appendChild(el);
  }
}

function renderTodayCard(tk, now) {
  const wrap = document.getElementById('today-card-wrap');
  const sh   = shifts[tk];
  if (!sh) {
    wrap.innerHTML = `
      <div class="today-card">
        <div class="tc-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          今天 · ${now.getMonth()+1}/${now.getDate()} (${WD_SHORT[now.getDay()]})
        </div>
        <div class="tc-empty">今天沒有排班</div>
        <button class="tc-add" onclick="openModal('${tk}')">＋ 新增今日班次</button>
      </div>`;
    return;
  }
  const type = getShiftType(sh.typeId);
  const c    = typeColors(type);
  const hrs  = calcHours(sh.start, sh.end, sh.breakMin ?? settings.breakMinutes);
  const cat  = autoClassify(sh.start);
  wrap.innerHTML = `
    <div class="today-card" onclick="openModal('${tk}')">
      <div class="tc-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        今天 · ${now.getMonth()+1}/${now.getDate()} (${WD_SHORT[now.getDay()]})
      </div>
      <div class="tc-top">
        <div class="tc-time">${sh.start} – ${sh.end}</div>
        <span class="tc-badge" style="background:${c.dot}">${type.name}</span>
      </div>
      <div class="tc-meta">
        ${fmtHoursFull(hrs)}
        ${sh.note ? `<span class="tc-note"> · ${sh.note}</span>` : ''}
      </div>
    </div>`;
}

function renderUpcoming(now) {
  const label = document.getElementById('upcoming-label');
  const list  = document.getElementById('upcoming-list');
  list.innerHTML = '';
  const items = [];
  for (let i = 1; i <= 6; i++) {
    const d = new Date(now); d.setDate(now.getDate()+i);
    const k = dateKey(d);
    if (shifts[k]) items.push({ key:k, date:d, sh:shifts[k] });
  }
  if (!items.length) {
    label.textContent = '';
    list.innerHTML = `<div class="empty-state"><div class="ei">🗓️</div><p>未來 6 天尚無排班<br>點 ＋ 新增班次</p></div>`;
    return;
  }
  label.textContent = '近期班次';
  items.forEach(({ key, date, sh }) => {
    const type = getShiftType(sh.typeId);
    const c    = typeColors(type);
    const hrs  = calcHours(sh.start, sh.end, sh.breakMin ?? settings.breakMinutes);
    const el   = document.createElement('div');
    el.className = 'shift-item';
    el.innerHTML = `
      <div class="shift-bar" style="background:${c.dot}"></div>
      <div class="shift-info">
        <div class="shift-name">${type.name}</div>
        <div class="shift-time">${sh.start} – ${sh.end}</div>
        <div class="shift-meta">${WD_SHORT[date.getDay()]} ${date.getMonth()+1}/${date.getDate()}${sh.note?' · '+sh.note:''}</div>
      </div>
      <div>
        <div class="shift-hrs">${fmtHours(hrs)}</div>
        <div class="shift-hrs-lbl">小時</div>
      </div>`;
    el.onclick = () => openModal(key);
    list.appendChild(el);
  });
}

// ══ CALENDAR ══
let calYear = new Date().getFullYear(), calMonth = new Date().getMonth();
document.getElementById('cal-prev').onclick = () => { calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); };
document.getElementById('cal-next').onclick = () => { calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); };

function renderCalendar() {
  const y=calYear, m=calMonth;
  document.getElementById('cal-month-label').innerHTML =
    `${y} <span>${MONTHS[m]}</span>`;

  const first = new Date(y,m,1), last = new Date(y,m+1,0);
  const tok   = todayKey();
  const grid  = document.getElementById('cal-days');
  grid.innerHTML = '';

  const addDay = (date, other) => {
    const k   = dateKey(date);
    const sh  = shifts[k];
    const dow = date.getDay();
    const el  = document.createElement('div');
    let cls = 'cal-day';
    if (other) cls += ' other-month';
    if (k===tok) cls += ' today';
    if (dow===0) cls += ' sunday';
    if (dow===6) cls += ' saturday';
    el.className = cls;

    if (sh && !other && k!==tok) {
      const c = typeColors(getShiftType(sh.typeId));
      el.style.background  = c.bg;
      el.style.border      = `1px solid ${c.border}`;
    }

    let inner = `<span class="day-num">${date.getDate()}</span>`;
    if (sh) {
      const c = typeColors(getShiftType(sh.typeId));
      const dotBg = k===tok ? 'rgba(42,38,32,.25)' : c.dot;
      inner += `
        <span class="day-shift-time" style="color:${k===tok?'var(--dark)':c.text}">${sh.start}<br>${sh.end}</span>
        <span class="day-dot" style="background:${dotBg}"></span>`;
    } else {
      inner += `<span class="day-add">+</span>`;
    }
    el.innerHTML = inner;
    el.onclick = () => openModal(k);
    grid.appendChild(el);
  };

  // leading
  for (let i=0; i<first.getDay(); i++) {
    addDay(new Date(y,m,-first.getDay()+i+1), true);
  }
  for (let d=1; d<=last.getDate(); d++) addDay(new Date(y,m,d), false);
  // trailing
  const trail = 7 - ((first.getDay()+last.getDate())%7 || 7);
  for (let i=1; i<=trail; i++) addDay(new Date(y,m+1,i), true);

  // legend
  const leg = document.getElementById('cal-legend');
  leg.innerHTML = '';
  [
    { label:'早班', dot:'#3f9d72' },
    { label:'中班', dot:'#d9a23f' },
    { label:'晚班', dot:'#6b62c4' },
  ].forEach(({ label, dot }) => {
    const d = document.createElement('div');
    d.className = 'legend-item';
    d.innerHTML = `<span class="legend-dot" style="background:${dot}"></span>${label}`;
    leg.appendChild(d);
  });

  renderCalDetail();
}

function renderCalDetail() {
  const label = document.getElementById('cal-detail-label');
  const list  = document.getElementById('cal-detail-list');
  list.innerHTML = '';
  const month = Object.entries(shifts)
    .filter(([k]) => { const d=parseKey(k); return d.getFullYear()===calYear && d.getMonth()===calMonth; })
    .sort(([a],[b]) => a.localeCompare(b));
  if (!month.length) { label.textContent=''; return; }
  label.textContent = `本月 ${month.length} 筆班次`;
  month.forEach(([k,sh]) => {
    const date = parseKey(k);
    const type = getShiftType(sh.typeId);
    const c    = typeColors(type);
    const hrs  = calcHours(sh.start, sh.end, sh.breakMin ?? settings.breakMinutes);
    const el   = document.createElement('div');
    el.className = 'shift-item';
    el.innerHTML = `
      <div class="shift-bar" style="background:${c.dot}"></div>
      <div class="shift-info">
        <div class="shift-name">${type.name}</div>
        <div class="shift-time">${sh.start} – ${sh.end}</div>
        <div class="shift-meta">${date.getMonth()+1}/${date.getDate()} ${WD_SHORT[date.getDay()]}${sh.note?' · '+sh.note:''}</div>
      </div>
      <div>
        <div class="shift-hrs">${fmtHours(hrs)}</div>
        <div class="shift-hrs-lbl">小時</div>
      </div>`;
    el.onclick = () => openModal(k);
    list.appendChild(el);
  });
}

// ══ STATS ══
let statYear = new Date().getFullYear(), statMonth = new Date().getMonth();
document.getElementById('stat-prev').onclick = () => { statMonth--; if(statMonth<0){statMonth=11;statYear--;} renderStats(); };
document.getElementById('stat-next').onclick = () => { statMonth++; if(statMonth>11){statMonth=0;statYear++;} renderStats(); };

function renderStats() {
  document.getElementById('stat-month-label').textContent = `${statYear}年 ${MONTHS[statMonth]}`;
  const monthShifts = Object.entries(shifts).filter(([k]) => {
    const d = parseKey(k);
    return d.getFullYear()===statYear && d.getMonth()===statMonth;
  });

  let totalH=0;
  const byType = {};
  monthShifts.forEach(([,sh]) => {
    const hrs = calcHours(sh.start, sh.end, sh.breakMin ?? settings.breakMinutes);
    totalH += hrs;
    if (!byType[sh.typeId]) byType[sh.typeId]={ count:0, hours:0 };
    byType[sh.typeId].count++;
    byType[sh.typeId].hours += hrs;
  });

  const days = monthShifts.length;
  const avg  = days ? totalH/days : 0;
  const rate = settings.hourlyRate||0;
  const std  = settings.stdHours||8;
  const ot   = settings.otRate||1.34;
  let salary = 0;
  monthShifts.forEach(([,sh]) => {
    const h = calcHours(sh.start, sh.end, sh.breakMin ?? settings.breakMinutes);
    salary += h <= std ? h*rate : std*rate + (h-std)*rate*ot;
  });

  document.getElementById('salary-val').textContent = `NT$ ${Math.round(salary).toLocaleString()}`;
  document.getElementById('salary-det').textContent =
    `${days} 天 · ${totalH.toFixed(1)} 小時 · 時薪 NT$${rate}${ot!==1?' · 加班 '+ot+'倍':''}`;
  document.getElementById('stat-hours').textContent    = totalH.toFixed(1);
  document.getElementById('stat-days').textContent     = days;
  document.getElementById('stat-avg').textContent      = avg.toFixed(1);
  document.getElementById('stat-rate-disp').textContent = rate;

  const bl = document.getElementById('breakdown-list');
  bl.innerHTML = '';
  if (!Object.keys(byType).length) {
    bl.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text3);font-size:14px">本月尚無班次紀錄</div>';
    return;
  }
  Object.entries(byType).sort(([,a],[,b])=>b.hours-a.hours).forEach(([tid,data]) => {
    const type = getShiftType(tid);
    const c    = typeColors(type);
    const el   = document.createElement('div');
    el.className = 'breakdown-item';
    el.innerHTML = `
      <div class="breakdown-dot" style="background:${c.dot}"></div>
      <div class="breakdown-name">${type.name}</div>
      <div class="breakdown-cnt" style="margin-right:12px">${data.count} 天</div>
      <div class="breakdown-hrs" style="color:${c.dot}">${data.hours.toFixed(1)}h</div>`;
    bl.appendChild(el);
  });
}

// ══ SETTINGS ══
function renderSettings() {
  document.getElementById('set-hourly').value   = settings.hourlyRate  ?? '';
  document.getElementById('set-break').value    = settings.breakMinutes ?? 0;
  document.getElementById('set-ot').value       = settings.otRate      ?? 1.34;
  document.getElementById('set-std-hrs').value  = settings.stdHours    ?? 8;

  ['set-hourly','set-break','set-ot','set-std-hrs'].forEach(id => {
    document.getElementById(id).oninput = () => {
      settings.hourlyRate   = parseFloat(document.getElementById('set-hourly').value)||0;
      settings.breakMinutes = parseInt(document.getElementById('set-break').value)||0;
      settings.otRate       = parseFloat(document.getElementById('set-ot').value)||1.34;
      settings.stdHours     = parseFloat(document.getElementById('set-std-hrs').value)||8;
      save(STORE_SETTINGS, settings);
    };
  });
  renderTypeTags();
}

function renderTypeTags() {
  const wrap = document.getElementById('type-tags-list');
  wrap.innerHTML = '';
  settings.shiftTypes.forEach(t => {
    const c  = typeColors(t);
    const el = document.createElement('div');
    el.className = 'type-tag';
    el.style.background = c.bg;
    el.style.border     = `1px solid ${c.border}`;
    el.style.color      = c.text;
    el.innerHTML = `<div class="dot" style="background:${c.dot}"></div>${t.name}<button class="type-tag-del" onclick="deleteType('${t.id}')">✕</button>`;
    wrap.appendChild(el);
  });
}

function deleteType(id) {
  if (settings.shiftTypes.length <= 1) { alert('至少保留一個班別'); return; }
  settings.shiftTypes = settings.shiftTypes.filter(t=>t.id!==id);
  save(STORE_SETTINGS, settings);
  renderTypeTags();
}

document.getElementById('btn-add-type').onclick = () => {
  const name = prompt('班別名稱（最多4字）');
  if (!name?.trim()) return;
  const palette = ['#3f9d72','#d9a23f','#6b62c4','#e05252','#0891b2','#8b5cf6','#f97316'];
  const color   = palette[settings.shiftTypes.length % palette.length];
  settings.shiftTypes.push({ id:'s'+Date.now(), name:name.trim().slice(0,4), color });
  save(STORE_SETTINGS, settings);
  renderTypeTags();
};

document.getElementById('btn-export').onclick = () => {
  const blob = new Blob([JSON.stringify({shifts,settings},null,2)],{type:'application/json'});
  const a    = Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:`班表_${new Date().toISOString().slice(0,10)}.json`});
  a.click();
};

document.getElementById('btn-clear').onclick = () => {
  if (!confirm('確定要清除所有班次資料？\n此操作無法復原！')) return;
  shifts = {};
  save(STORE_SHIFTS, shifts);
  renderToday();
  alert('資料已清除');
};

// ══ MODAL ══
let editingKey = null;

function openModal(key) {
  const now = new Date();
  editingKey = key || dateKey(now);
  const existing = shifts[editingKey];
  document.getElementById('modal-title').textContent = existing ? '編輯班次' : '新增班次';
  document.getElementById('btn-delete').style.display = existing ? 'block' : 'none';
  document.getElementById('f-date').value = editingKey;
  document.getElementById('f-date').onchange = e => { editingKey = e.target.value; };

  // type picker
  const picker = document.getElementById('f-type-picker');
  picker.innerHTML = '';
  const selId = existing?.typeId || settings.shiftTypes[0].id;
  settings.shiftTypes.forEach(t => {
    const c   = typeColors(t);
    const sel = t.id === selId;
    const btn = document.createElement('button');
    btn.className = 'type-option' + (sel ? ' selected' : '');
    btn.style.background  = sel ? c.dot : '';
    btn.style.borderColor = sel ? c.dot : '';
    btn.innerHTML = `<span class="t-dot" style="background:${c.dot}"></span>${t.name}`;
    btn.onclick = () => {
      picker.querySelectorAll('.type-option').forEach((b,i) => {
        const tc = typeColors(settings.shiftTypes[i]);
        b.classList.remove('selected'); b.style.background=''; b.style.borderColor='';
      });
      btn.classList.add('selected'); btn.style.background=c.dot; btn.style.borderColor=c.dot;
    };
    picker.appendChild(btn);
  });

  document.getElementById('f-start').value = existing?.start || '09:00';
  document.getElementById('f-end').value   = existing?.end   || '18:00';
  document.getElementById('f-note').value  = existing?.note  || '';

  updateHoursPreview();
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

function selectTypeInPicker(typeId) {
  const picker = document.getElementById('f-type-picker');
  picker.querySelectorAll('.type-option').forEach((btn, idx) => {
    const t  = settings.shiftTypes[idx];
    if (!t) return;
    const c  = typeColors(t);
    const sel = t.id === typeId;
    btn.classList.toggle('selected', sel);
    btn.style.background  = sel ? c.dot : '';
    btn.style.borderColor = sel ? c.dot : '';
  });
}

function autoClassifyAndSelect(start) {
  const cat = autoClassify(start);
  if (cat) selectTypeInPicker(cat.id);
}

function handleStartTimeChange() {
  updateHoursPreview();
  autoClassifyAndSelect(document.getElementById('f-start').value);
}

function updateHoursPreview() {
  const s   = document.getElementById('f-start').value;
  const e   = document.getElementById('f-end').value;
  const h   = calcHours(s, e, settings.breakMinutes);
  const cat = autoClassify(s);
  const c   = cat ? typeColors(cat) : { bg:'#f7f4ee', border:'var(--bd)', text:'var(--text2)', dot:'#a8a299' };
  const wrap = document.getElementById('hours-preview');
  wrap.style.background   = c.bg;
  wrap.style.borderColor  = c.border;
  wrap.innerHTML = `
    <span class="hp-badge" style="background:${c.bg};color:${c.text};border:1px solid ${c.border}">
      <span class="hp-dot" style="background:${c.dot}"></span>${cat?cat.name:'—'}
    </span>
    <span class="hp-sep">·</span>
    <span class="hp-val" style="color:${c.dot}">${h>0?fmtHoursFull(h):'—'}</span>`;
}

function saveShift() {
  const key   = document.getElementById('f-date').value;
  const selBtn = document.querySelector('#f-type-picker .type-option.selected');
  const typeId = selBtn
    ? (settings.shiftTypes.find(t => selBtn.textContent.trim().includes(t.name))?.id || settings.shiftTypes[0].id)
    : settings.shiftTypes[0].id;
  const start = document.getElementById('f-start').value;
  const end   = document.getElementById('f-end').value;
  const note  = document.getElementById('f-note').value.trim();
  if (!key || !start || !end) { alert('請填寫日期與時間'); return; }
  shifts[key] = { typeId, start, end, note };
  save(STORE_SHIFTS, shifts);
  closeModal();
  refreshAll();
}

function deleteShift() {
  if (!editingKey || !shifts[editingKey]) return;
  if (!confirm('確定刪除這筆班次？')) return;
  delete shifts[editingKey];
  save(STORE_SHIFTS, shifts);
  closeModal();
  refreshAll();
}

function refreshAll() {
  if (currentPage==='today')    renderToday();
  if (currentPage==='calendar') renderCalendar();
  if (currentPage==='stats')    renderStats();
}

// ══ INIT ══
(function() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  calYear=statYear=new Date().getFullYear();
  calMonth=statMonth=new Date().getMonth();
  renderToday();
})();
</script>
